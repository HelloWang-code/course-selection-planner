<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选课系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5;
    color: #333;
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, #4a90e2, #357abd);
    color: #fff;
    padding: 20px 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 24px; margin-bottom: 6px; }
  header p { opacity: 0.9; font-size: 14px; }

  .container {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 20px;
    max-width: 1280px;
    margin: 20px auto;
    padding: 0 20px;
  }

  .main { min-width: 0; }
  .sidebar {
    position: sticky;
    top: 20px;
    align-self: start;
    background: #fff;
    border-radius: 8px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }

  .category {
    background: #fff;
    border-radius: 8px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .category-header {
    padding: 14px 20px;
    background: #f5f7fa;
    border-left: 4px solid #4a90e2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .category-header h2 { font-size: 17px; color: #2c3e50; }
  .category-header .req {
    font-size: 13px;
    color: #7f8c8d;
    background: #e8ecef;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .category-body { padding: 10px 20px 16px; }

  .course {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid #e8ecef;
    border-radius: 6px;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .course:hover { border-color: #4a90e2; background: #fafcff; }
  .course.selected { background: #e8f5e9; border-color: #66bb6a; }
  .course.completed { background: #eef2f7; border-color: #7f8c8d; border-style: dashed; }
  .course.completed.selected { background: #e8f5e9; border-color: #66bb6a; border-style: solid; }
  .course.completed .course-name { color: #7f8c8d; }
  .course.completed .course-name::after {
    content: "已修";
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    border-radius: 8px;
    background: #7f8c8d;
    color: #fff;
    font-size: 11px;
    font-weight: 500;
  }
  .course-info { flex: 1; min-width: 0; }
  .course-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  .course-credit { margin: 0; padding: 2px 8px; }
  .course-name {
    font-weight: 500;
    color: #2c3e50;
    word-break: normal;
    overflow-wrap: anywhere;
    white-space: normal;
    line-height: 1.45;
    max-height: 2.9em;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .course-meta { font-size: 12px; color: #95a5a6; margin-top: 2px; }
  .course-group {
    margin-top: 18px;
    border: 1px solid #e0e6ed;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .course-group:first-child { margin-top: 8px; }
  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(90deg, #f4f8fb, #eef2f7);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid #e0e6ed;
    transition: background 0.15s;
  }
  .group-header:hover { background: #e8eef5; }
  .group-arrow {
    color: #5a6c7d;
    font-size: 12px;
    width: 14px;
    display: inline-block;
    transition: transform 0.2s;
  }
  .group-name {
    font-weight: 600;
    color: #2c3e50;
    font-size: 15px;
    flex: 1;
    min-width: 0;
    word-break: normal;
    overflow-wrap: anywhere;
    white-space: normal;
    line-height: 1.3;
  }
  .group-meta {
    color: #7f8c8d;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .group-status {
    margin-left: auto;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .group-body {
    padding: 8px 12px 12px;
    background: #fbfcfd;
  }
  .group-detail-btn {
    margin-left: 10px;
    padding: 2px 10px;
    font-size: 12px;
    color: #8e44ad;
    border: 1px solid #d2b4de;
    border-radius: 10px;
    cursor: pointer;
    background: #fff;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .group-detail-btn:hover {
    background: #8e44ad;
    color: #fff;
  }
  .course-credit {
    background: #fff3cd;
    color: #856404;
    border-radius: 10px;
    font-size: 12px;
    white-space: nowrap;
  }
  .btn {
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .btn-select { background: #4a90e2; color: #fff; }
  .btn-select:hover { background: #357abd; }
  .btn-drop { background: #e74c3c; color: #fff; }
  .btn-drop:hover { background: #c0392b; }
  .btn-done { background: #fff; color: #7f8c8d; border: 1px solid #bdc3c7; margin-right: 6px; }
  .btn-done:hover { background: #ecf0f1; }
  .btn-done.active { background: #34495e; color: #fff; border-color: #34495e; }
  .btn-done.active:hover { background: #2c3e50; }
  .btn-detail { background: #95a5a6; color: #fff; margin-right: 6px; }
  .btn-reset {
    width: 100%; padding: 8px 12px;
    background: #fff; color: #e74c3c; border: 1px solid #e74c3c;
    border-radius: 6px; cursor: pointer; font-size: 13px;
    transition: all 0.15s;
  }
  .btn-reset:hover { background: #e74c3c; color: #fff; }
  .btn-detail:hover { background: #7f8c8d; }

  .modal-mask {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    display: none; justify-content: center; align-items: center;
    z-index: 1000;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 8px; padding: 24px 28px;
    max-width: 560px; width: 90%; max-height: 80vh; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    position: relative;
  }
  .modal h3 { color: #2c3e50; margin-bottom: 8px; font-size: 18px; }
  .modal .modal-meta { font-size: 13px; color: #95a5a6; margin-bottom: 14px; }
  .modal .modal-desc { color: #444; font-size: 14px; line-height: 1.8; }
  .modal-desc p { margin: 8px 0; }
  .modal-desc h1, .modal-desc h2, .modal-desc h3, .modal-desc h4, .modal-desc h5, .modal-desc h6 {
    margin: 14px 0 8px; color: #2c3e50; font-weight: 600; line-height: 1.4;
  }
  .modal-desc h1 { font-size: 18px; }
  .modal-desc h2 { font-size: 17px; }
  .modal-desc h3 { font-size: 16px; }
  .modal-desc h4, .modal-desc h5, .modal-desc h6 { font-size: 15px; }
  .modal-desc ul, .modal-desc ol { margin: 8px 0; padding-left: 24px; }
  .modal-desc li { margin: 4px 0; }
  .modal-desc hr { border: 0; border-top: 1px dashed #e0e6ed; margin: 12px 0; }
  .modal-desc strong { color: #2c3e50; font-weight: 600; }
  .modal-desc code {
    background: #f4f6f8; padding: 1px 5px; border-radius: 3px;
    font-family: Consolas, Monaco, monospace; font-size: 13px; color: #c0392b;
  }
  .md-table-wrap { overflow-x: auto; margin: 10px 0; }
  .md-table {
    border-collapse: collapse; width: 100%; font-size: 13px;
    background: #fff; border: 1px solid #e0e6ed; border-radius: 4px; overflow: hidden;
  }
  .md-table th, .md-table td {
    border: 1px solid #e0e6ed; padding: 6px 10px; text-align: left; vertical-align: top;
  }
  .md-table th {
    background: #f4f8fb; color: #2c3e50; font-weight: 600; white-space: nowrap;
  }
  .md-table tbody tr:nth-child(even) { background: #fafbfc; }
  .md-table tbody tr:hover { background: #f0f7ff; }
  .modal-images { margin-top: 16px; border-top: 1px dashed #ecf0f1; padding-top: 12px; }
  .modal-images .img-title { font-size: 13px; color: #7f8c8d; margin-bottom: 8px; }
  .modal-images img {
    width: 100%; border: 1px solid #ecf0f1; border-radius: 4px;
    margin-bottom: 10px; display: block;
  }
  .modal-close {
    position: absolute; top: 12px; right: 16px;
    border: none; background: none; font-size: 22px; color: #95a5a6;
    cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: #333; }

  .stat-box { margin-bottom: 16px; }
  .stat-total {
    font-size: 28px;
    font-weight: bold;
    color: #4a90e2;
    margin: 4px 0;
  }
  .stat-label { color: #7f8c8d; font-size: 13px; }

  .progress-bar {
    height: 8px;
    background: #ecf0f1;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #66bb6a, #4caf50);
    transition: width 0.3s;
  }

  .selected-list { list-style: none; }
  .selected-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed #ecf0f1;
    font-size: 13px;
  }
  .selected-list li:last-child { border-bottom: none; }
  .selected-list .empty { color: #bdc3c7; text-align: center; padding: 20px 0; }

  .req-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 6px 0;
    border-bottom: 1px dashed #ecf0f1;
  }
  .req-item .ok { color: #27ae60; }
  .req-item .warn { color: #e67e22; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44, 62, 80, 0.95);
    color: #fff;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }

  .semester-bar {
    background: #fff;
    padding: 12px 20px;
    border-bottom: 1px solid #e8ecef;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    max-width: 1280px;
    margin: 0 auto;
    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  }
  .semester-bar .label {
    font-size: 13px;
    color: #7f8c8d;
    margin-right: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .semester-btn {
    border: 1px solid #d5dbdb;
    background: #fff;
    color: #34495e;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .semester-btn:hover { border-color: #4a90e2; color: #4a90e2; }
  .semester-btn.active {
    background: #4a90e2;
    color: #fff;
    border-color: #4a90e2;
  }
  .course-semester {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 8px;
    background: #eaf4fe;
    color: #357abd;
    margin-left: 8px;
    white-space: nowrap;
    vertical-align: middle;
  }
  .empty-hint {
    padding: 30px 20px;
    text-align: center;
    color: #bdc3c7;
    font-size: 13px;
    background: #fff;
    border-radius: 8px;
  }

  .home-grid {
    background: #fff;
    border-radius: 8px;
    padding: 8px 20px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .tree-node { user-select: none; }
  .tree-node-row {
    display: flex;
    align-items: center;
    padding: 9px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    gap: 6px;
  }
  .tree-node-row:hover { background: #f5f7fa; }
  .tree-arrow {
    width: 16px; height: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #95a5a6;
    font-size: 12px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .tree-arrow.leaf { color: transparent; }
  .tree-arrow.expanded { transform: rotate(90deg); }
  .tree-icon {
    font-size: 15px;
    margin-right: 4px;
    flex-shrink: 0;
  }
  .tree-name {
    font-size: 14px;
    color: #2c3e50;
    flex: 1;
    min-width: 0;
    word-break: normal;
    overflow-wrap: anywhere;
    white-space: normal;
    line-height: 1.4;
  }
  .tree-node-row.is-leaf .tree-name { font-weight: 500; }
  .tree-node-row.is-leaf:hover .tree-name { color: #4a90e2; }
  .tree-req {
    font-size: 12px;
    color: #7f8c8d;
    background: #e8ecef;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .tree-stats {
    font-size: 11px;
    color: #95a5a6;
    white-space: nowrap;
  }
  .tree-progress {
    font-size: 11px;
    white-space: nowrap;
    margin-left: 6px;
  }
  .tree-progress.ok { color: #27ae60; }
  .tree-progress.warn { color: #e67e22; }
  .tree-children {
    margin-left: 22px;
    border-left: 1px dashed #d5dbdb;
    padding-left: 4px;
    display: none;
  }
  .tree-children.show { display: block; }
  .tree-enter {
    font-size: 12px;
    color: #4a90e2;
    padding: 2px 8px;
    border: 1px solid #4a90e2;
    border-radius: 10px;
    white-space: nowrap;
    margin-left: 6px;
  }
  .tree-node-row.is-leaf:hover .tree-enter { background: #4a90e2; color: #fff; }
  .tree-cat-detail {
    font-size: 12px;
    color: #9b59b6;
    padding: 2px 8px;
    border: 1px solid #9b59b6;
    border-radius: 10px;
    white-space: nowrap;
    margin-left: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tree-cat-detail:hover { background: #9b59b6; color: #fff; }

  .sub-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .btn-back {
    border: none;
    background: linear-gradient(135deg, #ff6b35, #e74c3c);
    color: #fff;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(231, 76, 60, 0.45), 0 0 0 3px rgba(231, 76, 60, 0.12);
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    animation: btn-back-pulse 2s ease-in-out infinite;
  }
  .btn-back:hover {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    box-shadow: 0 6px 18px rgba(231, 76, 60, 0.6), 0 0 0 4px rgba(231, 76, 60, 0.2);
    transform: translateY(-2px) scale(1.03);
  }
  .btn-back:active { transform: translateY(0) scale(1); }
  .btn-back .arrow {
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
    display: inline-block;
    transition: transform 0.2s;
  }
  .btn-back:hover .arrow { transform: translateX(-4px); }
  @keyframes btn-back-pulse {
    0%, 100% { box-shadow: 0 4px 12px rgba(231, 76, 60, 0.45), 0 0 0 3px rgba(231, 76, 60, 0.12); }
    50% { box-shadow: 0 4px 16px rgba(231, 76, 60, 0.55), 0 0 0 7px rgba(231, 76, 60, 0.08); }
  }
  .sub-header h2 {
    font-size: 19px;
    color: #2c3e50;
    flex: 1;
    min-width: 0;
    word-break: normal;
    overflow-wrap: anywhere;
    white-space: normal;
    line-height: 1.3;
  }
  .sub-header .sub-req {
    font-size: 13px; color: #7f8c8d;
    background: #e8ecef; padding: 3px 10px; border-radius: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .course.disabled { opacity: 0.55; background: #fafafa; }
  .btn-select:disabled,
  .btn-drop:disabled {
    background: #bdc3c7 !important;
    cursor: not-allowed;
    opacity: 0.7;
  }
  .course.disabled:hover { border-color: #e8ecef; background: #fafafa; }

  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: none; }
    .course {
      padding: 10px 12px;
      gap: 8px;
    }
    .course-info { min-width: 0; flex: 1; }
    .course-name {
      font-size: 14px;
      word-break: normal;
      overflow-wrap: anywhere;
      white-space: normal;
      line-height: 1.45;
      hyphens: auto;
      text-wrap: pretty;
    }
    .course-meta { font-size: 11px; }
    /* 学分徽章:简化为只显示数字 */
    .course-credit {
      font-size: 11px;
      padding: 2px 5px;
      white-space: nowrap;
    }
    /* 按钮区整体瘦身,不再把文字撑宽 */
    .course-actions {
      gap: 4px;
      margin-left: 4px;
    }
    .course .btn {
      padding: 5px 8px;
      font-size: 12px;
      min-width: 0;
      line-height: 1.2;
      white-space: nowrap;
    }
    .category-body { padding: 8px 14px 12px; }
    .group-header { padding: 8px 12px; }
  }
  /* 极窄屏(≤420px,手机竖屏) — 按钮改单字,最大化课程名宽度 */
  @media (max-width: 420px) {
    .course { padding: 8px 10px; gap: 6px; }
    .course-name {
      font-size: 13px;
      line-height: 1.4;
      word-break: normal;
      overflow-wrap: anywhere;
      white-space: normal;
      max-height: 2.8em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .course-meta { font-size: 10px; line-height: 1.3; }
    /* 学分徽章:隐藏"学分"二字,只显示数字 */
    .course-credit {
      font-size: 11px;
      padding: 2px 4px;
      min-width: 0;
    }
    .course-actions { gap: 3px; margin-left: 2px; flex-shrink: 0; }
    /* 按钮瘦身:选修→选,退选→退,已修→已,已修✓→✓,详情→📋 */
    .course .btn {
      padding: 4px 5px;
      font-size: 11px;
      border-radius: 4px;
      min-width: 0;
    }
    .course .btn-select { font-size: 0; padding: 4px 7px; }
    .course .btn-select::after { content: "选"; font-size: 11px; }
    .course .btn-drop { font-size: 0; padding: 4px 7px; }
    .course .btn-drop::after { content: "退"; font-size: 11px; }
    .course .btn-done:not(.active) { font-size: 0; padding: 4px 7px; }
    .course .btn-done:not(.active)::after { content: "已"; font-size: 11px; }
    .course .btn-done.active { font-size: 0; padding: 4px 6px; }
    .course .btn-done.active::after { content: "✓"; font-size: 11px; }
    .course .btn-detail { font-size: 0; padding: 4px 5px; }
    .course .btn-detail::after { content: "📋"; font-size: 11px; }

    /* 目录树(根目录/次级目录)移动端优化 */
    .home-grid { padding: 8px 12px 14px; }
    .tree-node-row { padding: 8px 6px; gap: 4px; }
    .tree-name {
      font-size: 13px;
      line-height: 1.35;
      word-break: normal;
      overflow-wrap: anywhere;
      white-space: normal;
    }
    .tree-req {
      font-size: 10px;
      padding: 1px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .tree-stats { font-size: 10px; flex-shrink: 0; }
    .tree-progress { font-size: 10px; margin-left: 4px; flex-shrink: 0; }
    .tree-enter {
      font-size: 10px;
      padding: 1px 6px;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .tree-children { margin-left: 14px; padding-left: 4px; }

    /* 子页面标题(如"专业必修课"下一级目录)移动端优化 */
    .sub-header {
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-back {
      padding: 8px 14px;
      font-size: 13px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(231, 76, 60, 0.35);
      animation: none;

          { id: "p5b", name: "计算概论 A", credit: 3, meta: "C/C++,需同时选上机课", semester: "大一秋", desc: "\"计算概论 A\"课程简介\n\n课程编号:04830041  开课学期:秋季学期\n课程名称:计算概论 A  学分:3\n总学时:64 学时理论课(每周 4 学时)+32 学时上机实习课(每周 2 学时)\n\n一、基本目的\n1. 讲授计算机语言程序设计基础,使学习者掌握程序设计的基本概念、基本方法,并且在实践环节逐步掌握程序设计的技巧,并且建立良好的编程习惯,写出规范的程序代码。\n2. 在学习过程中,学生将通过程序的结构和相应的语句,写出计算机程序,这是学生必须掌握的基本功。注重学生对问题抽象能力的培养,学习如何把要解决实际的问题用数学的形式表示以及符号化的方法处理。注重训练学生逻辑思维的能力,学习如何分析问题,确定解题思路。\n3. 解决实际问题是最终的目标,因此,程序的调试也是必不可少的学习内容。\n\n二、教学内容\n第 1 章 计算机与信息社会\n重点:计算机和互联网的发展历程,二进制数制表示、运算及数制编码原理。\n要求:了解计算机和互联网的发展历程和现状;熟练掌握二进制数制表示、二进制运算及数值二进制编码原理。\n\n第 2 章 互联网与信息共享\n重点:互联网的硬件设施、通信协议和基本应用,动手接入互联网的基本知识。\n要求:了解互联网的硬件设施和通信协议在互联网中的角色和作用;熟悉互联网中的各类基本应用;了解自己动手组建局域网、接入互联网的相关实践知识。\n\n第 3 章 计算机的基本组成\n重点:计算机的结构及硬件组成,计算机系统的软件层次。\n要求:掌握计算机的 CPU、总线、内存和外设等设备部件之间的硬件组成关系;了解各种类型的计算机部件设备;掌握计算机\"硬件、操作系统、系统软件、应用软件\"的软硬件层次关系;了解计算机硬件装配过程和软件系统安装过程。\n\n第 4 章 信息表示与信息输入输出\n重点:声音、颜色、图像、文字等信息二进制编码的基本原理。\n要求:掌握声音、颜色、图像、文字等信息二进制编码的基本原理;了解多媒体信息文件格式及编码与压缩技术,了解常用的多媒体软件;了解人机交互技术。\n\n第 5 章 信息存储\n重点:计算机存储系统从寄存器、高速缓存、内存到外存的层次结构。\n要求:掌握计算机存储系统层次结构及各层次存储器件的特点;了解磁盘、光盘和闪存(U 盘)的存储原理。\n\n第 6 章 CPU 的信息处理\n重点:CPU 的工作原理、指令及指令周期的概念;CPU 访问主存储器的工作原理。\n要求:了解图灵机计算的原理;掌握 CPU 的内部组成,及指令在 CPU 中执行的过程;掌握 CPU 访问主存储器的工作原理;了解数据(整数、浮点数)在主存储器中存储和表示。\n\n第 7 章 计算机软件与硬件的协同工作\n重点:操作系统的功能和作用,文件系统的概念和使用。\n要求:了解操作系统引导过程,了解操作系统的主要功能和典型的操作系统的实例;了解文件系统组织文件的原理和方法;了解信息安全的基本概念,初步了解加密技术和计算机病毒防范技术。\n\n第 8 章 程序设计 - 入门篇\n重点:程序设计的要素和过程,高级程序设计语言的特点,C 语言程序示例及程序规范。\n要求:理解程序设计从问题抽象到程序测试的整个过程;了解设计语言从机器语言到汇编语言再到高级程序设计语言的发展过程;理解示例程序处理问题的过程和程序执行的关系;掌握正确的规范化的程序设计。\n\n第 9 章 程序设计 - 基本框架\n重点:变量、常量、数据类型和表达式;指令流的控制;控制台输入和输出。\n要求:掌握变量、常量、数据类型和表达式等 C 语言中的基本概念;掌握语句顺序执行和分支循环语句对程序执行过程的控制;掌握基本的控制台输入输出方法;通过初等算法综合应用本章所学的语言点。\n\n第 10 章 程序设计 - 数组和结构\n重点:数组、结构、指针、字符串等数据类型;内存动态申请与释放;文件操作;排序和查找问题。\n要求:熟练掌握数组、结构两种复合数据结构的概念和使用;理解指针的概念和使用指针操作数据的特点,掌握字符串的概念和使用;了解通过指针和动态内存构造运行时刻才确定长度的数组;了解基本的文件操作函数;掌握最基本的排序和查找算法。\n\n第 11 章 程序设计 - 函数\n重点:函数的参数传递;变量作用域;递归调用的概念及应用。\n要求:掌握函数的定义与调用,理解值参和形参的差别;理解全局变量和局部变量的生命期,了解变量的作用域范围与代码块的关系;了解模块化程序设计思想(问题分解与抽象);掌握函数递归调用的原理及特点。\n\n第 12 章 问题分析与算法设计\n重点:程序设计优劣的判断标准(算法的时间复杂性);递归与分治、搜索与回溯、动态规划等一般的算法设计方法与思想。\n要求:了解程序设计的一般性经验,了解程序设计优劣的判断标准(即算法的时间复杂性和空间复杂性);掌握应用递归方法解决具有递归结构的问题,了解分治方法对提高一般递归算法运行速度的作用;掌握应用系统的搜索方法求解问题,了解回溯对提高搜索性能上的作用;掌握应用动态规划的方法求解一般的最优化问题,了解动态规划自顶向下分解问题,自底向上求解问题的程序设计方法;了解 NPC 问题的性质,认识一些常见的 NPC 问题。\n\n三、教学方式\n本课程课时安排为 4 学时/周,共 64 学时,包括课堂教授和上机,不同的教学班级,可以根据实际的需要适当调整课堂讲授和上机的学时分配。课程教学的环节包括:教师课堂讲授,学生在线实践及教师、助教现场辅导,学生利用网络课件和网络资源自学,学生课后作业和小组合作,教师、助教网络答疑和网络讨论等。除了传统的教学方式方法之外,我们尤其注重实践能力和创新能力的培养,设计了多种有特色的教学方法和教学手段,包括在线实践、多层次教学辅导、在线考试、与大学生程序设计竞赛相结合、定期的教学交流与讨论等。" },

      {
        id: "pe",
        name: "体育",

        min: 4, max: 4,
        desc: "### 大学体育课程\n\n#### 修读要求\n\n1. 体育课为全校公共必修课程,须修满 4 学分。其中,必选项目学分 1 学分,兴趣选修项目 3 学分。其中选修训练竞赛项目所获学分可抵扣兴趣选修项目学分,上限为 2 学分。每学期只能选 1 门体育必修课;每门课程每周 2 学时(不含训练竞赛项目),1 学分。\n\n2. 训练竞赛项目申请细则:\n   - 从 2025 级开始,对于非正式注册普通生体育代表队的学生,若符合特定条件(达到国家二级运动员以上等级或在体质健康测试中成绩达到 85 分及以上),即有资格申请选修训练竞赛项目(即普通生体育代表队)。学生须提交书面申请及相关证明材料,经训练竞赛项目专家组认定通过后,可加入普通生代表队,按照项目考核要求参加日常训练,可获得体育训练竞赛项目课 1 学分。\n   - 从 2025 级开始,对于已正式注册为普通生代表队的学生,若在赛事中取得优异成绩,经训练竞赛项目专家组认定后,可获得体育训练竞赛项目课 1 学分。\n\n3. 在完成体育必修课程的基础上,鼓励同学们在校期间结合个人兴趣,积极参与 1～2 个学校体育社团或院系体育俱乐部活动,享受兴趣、增强素质、健全人格、锤炼意识,丰富校园生活。\n\n#### 考核与成绩评定\n\n1. **体育必修课程成绩结构**\n   - 传统武术类项目课程、时尚舞美类项目课程:100 分 = 技术 40 分 + 体质健康测试 20 分 + 专项理论 10 分 + 学习态度 20 分 + 12 分钟跑 10 分;\n   - 其他体育必修课:100 分 = 技术 50 分 + 体质健康测试 20 分 + 专项理论 10 分 + 学习态度 20 分。\n\n2. **体质健康测试**\n   2022 年及以后入学的学生:无论是否选修体育课,每学年必须至少参加一次体质健康测试。学生毕业时的体质健康测试成绩,按毕业当年学年总分的 50%与其他学年总分平均得分的 50%之和进行评定。学生毕业时,体质健康测试成绩(按照《标准》测试)达不到 50 分者按结业或肄业处理。学生因病或残疾可向体育教研部提交暂缓或免于执行《标准》的申请。确实丧失运动能力、被免予执行《标准》的学生,仍可参加评奖评优,毕业时体质健康测试成绩需注明免测。体测成绩低于 50 分者,必选为提高体能而设置的体育必修课程:\u201c体能提升:运动与膳食\u201d\u201c体适能\u201d或者\u201c健身健美\u201d。选训练竞赛项目的学生须按照学校体质健康测试办法,正常参加体质健康测试。\n\n3. **课外体育锻炼**\n   课外锻炼是体育课程的一部分,学生选上体育必修课的学期,必须参加 85 公里课外体育锻炼并达到相应要求。未达要求的,体育课成绩记 0 分。学生选上训练竞赛项目的学期须完成每周课程要求的训练任务,可免除课外体育锻炼。\n\n#### 课程介绍\n\n1. **本科生体育必修课程**\n\n（1）**必选项目**\n传统武术类项目(男生);时尚舞美类项目(女生)。传统武术类项目:24 式简化太极拳(男生)、汉字太极与养生、导引与养生、无极球、非遗太极拳(王其和式)。时尚舞美类项目:健美操、艺术体操、健美操有氧舞蹈、体美。\n\n（2）**兴趣选修项目**\n共 38 个,每学期开设项目略有调整。游泳、网球、羽毛球、篮球、体适能、乒乓球、棒垒球、匹克球、骑行教育、击剑、中华毽、拓展训练、排球、地板球、高尔夫、定向与徒步运动、拳击、射箭、柔道、健身健美、足球、太极拳(女)、体育舞蹈、瑜伽、壁球、跆拳道、体能提升:运动与膳食、飞盘运动、龙舟、舞龙舞狮、国际象棋、剑道、安全教育与自卫防身、手球、游泳提高班、羽毛球提高班、篮球提高班、乒乓球提高班。\n\n（3）**训练竞赛项目**\n16 支普通生体育代表队,每学期开设项目略有调整。课程名称及课号:\u201c竞赛训练(一)\u201d04130010、\u201c竞赛训练(二)\u201d04130011。课程项目包括:女足、男足、女篮、男篮、女子排球、男子排球、匹克球、田径(中长跑)、游泳、赛艇、太极拳、健美操(啦啦操)、艺术体操、综合体能队(CROSSFIT)、定向运动、攀岩。\n\n（4）**体育保健**\n体育保健课是专为身体异常、特型,以及病(心脏病、高血压、癫痫、哮喘等不宜从事较为剧烈体育活动的疾病)、残、弱和特殊群体的学生开设的,以指导康复、保健为主的体育课程,属于体育必修课程,学生选修此课须提交校医院保健科的诊断证明,经任课教师同意后方可上课。\n\n（5）**航空体育**\n航空体育是双学籍飞行员学生必修课,须修满 6 学分。\n\n（6）**高级体育训练课**\n高级体育训练课是 2024 年以前入学的体育特长生必修课,须修满 9 学分。\n\n2. **其他体育课程(不占体育必修课学分)**\n\n（1）通选课:奥林匹克文化课(2 学分),户外探索(2 学分)。\n\n（2）公共选修课:运动营养与减肥(1 学分)、围棋(1 学分)、运动健身方法与实践(1 学分)、体育文化与创新精神(2 学分)、数字体育(2 学分)、运动损伤预防与处理(2 学分)、国际象棋提高班(1 学分)、乒乓球国际竞赛法和赛事组织(2 学分)。\n\n（3）暑期学校留学生课:骑行老北京城:探索千年古都回响(2 学分)。\n\n#### 教学管理办法\n\n1. **体育课程管理办法**\n（1）学生修体育课学分,可以自主选择课程、任课教师、上课时间。\n（2）学生获得体育必修课程 4 学分,达到《国家学生体质健康标准》的相关要求,是毕业和获得学位的必要条件。其中,男生必修传统武术类项目,女生必修时尚舞美类项目。\n\n2. **班级及课堂管理办法**\n（1）体育必修课每班人数根据项目特点和场馆器材条件,在 16～30 人之间,每班最多为 30 人,少于 16 人的班原则上取消。奥林匹克文化通选课人数最多为 100 人、围棋为 90 人。开课后学生不能擅自换班;考虑到体育课的安全问题,不允许非本班学生旁听课程。\n（2）学生通过教务部系统自行选课,原则上不再办理中期退课,如有特殊情况(如意外受伤、疾病等经医院诊断不能继续该课程学习)需退课,由学生本人写退课申请,提供诊断证明,任课教师签字,并报体育教研部教学主任批准后方可到体育教研部本科教务办公室办理退课。\n（3）学生要注意自身和同学的安全,在课上出现胸闷、心慌、头晕等不适状况,或身体处于疲弱状态,或发现其他同学出现不适,应及时告知任课教师,由教师根据情况处理。\n（4）学生上课应按照所选项目的要求,穿着合适的、有利于运动的运动服、运动鞋。不允许穿便装、牛仔服、皮鞋、拖鞋(游泳课除外);不允许戴围巾、戴太阳镜、接打手机、戴耳机等;女同学上课不允许披肩发。课前应根据相应项目的要求准备好所需的体育器材(如球拍),选修游泳课的学生应准备好游泳衣、游泳裤、游泳帽、游泳镜等。\n（5）选修训练竞赛项目的学生须严格按照《北京大学普通生体育代表队管理办法》完成选修学期的训练与竞赛要求。\n\n3. **关于考勤、缓考和旷考的处理办法**\n（1）考勤:学生出勤情况和课堂表现是评定学习态度的依据。每旷课一次扣 3 分,私假一次扣 2 分,公假一次扣 1 分(须提供院系或相关部门证明),病假一次扣 1 分(须提供校医院医疗诊断证明),迟到和早退一次各扣 1 分,扣满 15 分为止。一学期缺课累计超过该门课程学期总学时数三分之一者,不得参加该课程考试,该课程成绩以\u201c0\u201d分记。\n（2）缓考:因伤、病或其他个人特殊原因不能参加课程考试时,应在考试前向任课教师提出书面缓考申请(缓考审批单),提交医院诊断证明等相关材料,经任课教师同意后可不参加该学期的考试,同时将批准后的缓考审批单提交至体育教研部本科教务办公室(五四体育中心 203 室)办理缓考,期末成绩记录为缓考。学生务必在下学期开学两周内联系原任课教师考试,获得成绩后由原任课教师将成绩单提交至体育教研部本科教务办公室。\n（3）旷考:学生无故未参加一项或若干项考试,未考项成绩为 0 分,各项累加后体育课总成绩不论是否超过 60 分均按照实际成绩记载。",

// 扁平化所有叶子分类(带 courses 的节点),便于查找与统计
const categories = [];
(function collect(arr) {
  arr.forEach(node => {
    if (node.courses) { categories.push(node); return; }
    if (node.children) collect(node.children);
  });
})(tree);

const selected = new Set(JSON.parse(localStorage.getItem("xk_selected") || "[]"));
const completed = new Set(JSON.parse(localStorage.getItem("xk_completed") || "[]"));
const semesters = ["大一秋", "大一春", "大二秋", "大二春", "大三秋", "大三春", "大四秋", "大四春"];
let currentSemester = localStorage.getItem("xk_semester") || "all";
let currentView = "home";

function saveSelected() { localStorage.setItem("xk_selected", JSON.stringify([...selected])); }
function saveCompleted() { localStorage.setItem("xk_completed", JSON.stringify([...completed])); }
function saveSemester() { localStorage.setItem("xk_semester", currentSemester); }

function resetAll() {
  if (!confirm("确定清空全部已选课程?此操作不可撤销。")) return;
  selected.clear();
  saveSelected();
  if (currentView === "home") renderTree();
  else renderCategoryPage(currentView);
  renderSidebar();
  showToast("已清空全部选课");
}

function resetCompleted() {
  if (!confirm("确定清空全部已修标记?此操作不可撤销。")) return;
  completed.clear();
  saveCompleted();
  if (currentView === "home") renderTree();
  else renderCategoryPage(currentView);
  renderSidebar();
  showToast("已清空全部已修标记");
}

function courseMatchesSemester(c) {
  if (currentSemester === "all") return true;
  if (!c.semester) return true;
  if (c.semester === "任意") return true;
  if (Array.isArray(c.semester)) return c.semester.includes(currentSemester);
  return c.semester === currentSemester;
}

function semesterLabel(c) {
  if (!c.semester) return "";
  if (c.semester === "任意") return "任意学期";
  if (Array.isArray(c.semester)) return c.semester.join(" / ");
  return c.semester;
}

function renderSemesterBar() {
  const bar = document.getElementById("semesterBar");
  const allBtn = `<button class="semester-btn ${currentSemester === 'all' ? 'active' : ''}" onclick="setSemester('all')">全部</button>`;
  const btns = semesters.map(s =>
    `<button class="semester-btn ${currentSemester === s ? 'active' : ''}" onclick="setSemester('${s}')">${s}</button>`
  ).join("");
  const semHint = currentSemester === "all" ? "" : `<span style="margin-left:auto;font-size:12px;color:#95a5a6;">非「${currentSemester}」课程将禁用选修</span>`;
  bar.innerHTML = `<span class="label">选课学期:</span>${allBtn}${btns}${semHint}`;
}

function setSemester(s) {
  currentSemester = s;
  saveSemester();
  renderSemesterBar();
  if (currentView === "home") renderTree();
  else renderCategoryPage(currentView);
}

const expandedNodes = new Set(JSON.parse(localStorage.getItem("xk_expanded") || '["public_basic","major"]'));

function saveExpanded() { localStorage.setItem("xk_expanded", JSON.stringify([...expandedNodes])); }

function renderTree() {
  const container = document.getElementById("treeContainer");
  container.innerHTML = tree.map(node => renderTreeNode(node, 0)).join('');
}

function renderTreeNode(node, depth) {
  const isLeaf = !!node.courses;
  const expanded = expandedNodes.has(node.id);
  const arrowCls = isLeaf ? "tree-arrow leaf" : `tree-arrow${expanded ? ' expanded' : ''}`;
  const icon = isLeaf ? "📄" : (expanded ? "📂" : "📁");
  const rowCls = isLeaf ? "tree-node-row is-leaf" : "tree-node-row";

  let right = "";
  if (isLeaf) {
    const total = node.courses.length;
    const avail = node.courses.filter(c => courseMatchesSemester(c)).length;
    const catCredit = node.courses.filter(c => selected.has(c.id)).reduce((s, c) => s + c.credit, 0);
    let progText, progCls;
    if (catCredit >= node.min && catCredit <= node.max) {
      progText = `✓${catCredit}`; progCls = "tree-progress ok";
    } else if (catCredit < node.min) {
      progText = `差${node.min - catCredit}`; progCls = "tree-progress warn";
    } else {
      progText = `超${catCredit - node.max}`; progCls = "tree-progress warn";
    }
    const statsText = currentSemester === "all" ? `${total}门` : `${avail}`;
    const detailBtn = node.desc ? `<span class="tree-cat-detail" onclick="event.stopPropagation();showCatDetail('${node.id}')" title="查看分类介绍">详情</span>` : "";
    right = `<span class="tree-stats">${statsText}</span><span class="${progCls}">${progText}</span>${detailBtn}<span class="tree-enter">进入 →</span>`;
  } else {
    // 非叶子节点:显示要求徽章 + 详情按钮(若有 desc)+ 汇总子分类进度
    const reqBadge = node.require ? `<span class="tree-req">${node.require}</span>` : "";
    const detailBtn = node.desc ? `<span class="tree-cat-detail" onclick="event.stopPropagation();showCatDetail('${node.id}')" title="查看分类介绍">详情</span>` : "";
    // 汇总所有后代课程学分
    let allCourses = [];
    (function collectCourses(n) {
      if (n.courses) allCourses = allCourses.concat(n.courses);
      if (n.children) n.children.forEach(collectCourses);
    })(node);
    const total = allCourses.length;
    const catCredit = allCourses.filter(c => selected.has(c.id)).reduce((s, c) => s + c.credit, 0);
    let progText = "", progCls = "";
    if (node.min !== undefined) {
      if (catCredit >= node.min && catCredit <= node.max) {
        progText = `✓${catCredit}`; progCls = "tree-progress ok";
      } else if (catCredit < node.min) {
        progText = `差${node.min - catCredit}`; progCls = "tree-progress warn";
      } else {
        progText = `超${catCredit - node.max}`; progCls = "tree-progress warn";
      }
    }
    const statsText = `${total}门`;
    right = `${reqBadge}<span class="tree-stats">${statsText}</span>${progText ? `<span class="${progCls}">${progText}</span>` : ''}${detailBtn}`;
  }

  const onClick = isLeaf
    ? `enterCategory('${node.id}')`
    : `toggleNode('${node.id}')`;

  const childrenHtml = (!isLeaf && node.children)
    ? `<div class="tree-children${expanded ? ' show' : ''}" id="children-${node.id}">${node.children.map(ch => renderTreeNode(ch, depth + 1)).join('')}</div>`
    : "";

  return `
    <div class="tree-node">
      <div class="${rowCls}" onclick="${onClick}">
        <span class="${arrowCls}">▶</span>
        <span class="tree-icon">${icon}</span>
        <span class="tree-name">${node.name}</span>
        ${right}
      </div>
      ${childrenHtml}
    </div>
  `;
}

function toggleNode(id) {
  if (expandedNodes.has(id)) expandedNodes.delete(id);
  else expandedNodes.add(id);
  saveExpanded();
  renderTree();
}

function enterCategory(id) {
  currentView = id;
  document.getElementById("homeView").style.display = "none";
  document.getElementById("subView").style.display = "block";
  renderCategoryPage(id);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function backToHome() {
  currentView = "home";
  document.getElementById("subView").style.display = "none";
  document.getElementById("homeView").style.display = "block";
  renderTree();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderCategoryPage(id) {
  const cat = categories.find(c => c.id === id);
  if (!cat) return;
  document.getElementById("subHeader").innerHTML = `
    <button class="btn-back" onclick="backToHome()"><span class="arrow">←</span> 返回</button>
    <h2>${cat.name}</h2>
    <span class="sub-req">要求 ${cat.require}</span>
  `;
  const container = document.getElementById("courseContainer");

  // 方向学分配置(仅专业选修课用)
  const groupMin = {
    "专业数学类": 3,
    "计算基础与编程类": 8,
    "机器感知类": 3,
    "数据与机器智能类": 4,
    "物理与电子类": 2,
    "研究课程": 0,
    "信科学院选修": 2,
    "心理学院选修": 2,
    "新生讨论课": 1,
  };

  // 判断是否需要分组
  const hasGroup = cat.courses.some(c => c.group);
  if (!hasGroup) {
    container.innerHTML = cat.courses.map(c => renderCourseCard(c)).join('');
    return;
  }

  // 按 group 分组,保持出现顺序
  const groupOrder = [];
  const groupMap = {};
  cat.courses.forEach(c => {
    const g = c.group || "其他";
    if (!groupMap[g]) { groupMap[g] = []; groupOrder.push(g); }
    groupMap[g].push(c);
  });

  container.innerHTML = groupOrder.map((g, idx) => {
    const courses = groupMap[g];
    const min = groupMin[g] != null ? groupMin[g] : null;
    let groupCredit = 0;
    let selCount = 0;
    courses.forEach(c => { if (selected.has(c.id)) { groupCredit += c.credit; selCount++; } });
    const availCount = courses.filter(c => courseMatchesSemester(c)).length;
    const statusHtml = min != null
      ? (groupCredit >= min
          ? `<span style="color:#27ae60;">✓已选 ${groupCredit} 学分(达标)</span>`
          : `<span style="color:#e67e22;">差 ${min - groupCredit} 学分(已选 ${groupCredit})</span>`)
      : `<span style="color:#7f8c8d;">已选 ${groupCredit} 学分</span>`;
    const minLabel = min != null ? ` · 至少 ${min} 学分` : "";
    return `
      <div class="course-group">
        <div class="group-header" onclick="toggleGroup('${g}-${idx}')">
          <span class="group-arrow" id="arrow-${g}-${idx}">▶</span>
          <span class="group-name">(${idx + 1}) ${g}</span>
          <span class="group-meta">${minLabel} · 已选 ${selCount} · 可选 ${availCount}</span>
          <span class="group-status">${statusHtml}</span>
          <span class="group-detail-btn" onclick="event.stopPropagation();showGroupDetail('${id}','${g}')">详情</span>
        </div>
        <div class="group-body" id="group-${g}-${idx}" style="display:none;">
          ${courses.map(c => renderCourseCard(c)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function showGroupDetail(catId, groupName) {
  const cat = categories.find(c => c.id === catId);
  if (!cat) return;
  const courses = cat.courses.filter(c => c.group === groupName);
  if (!courses.length) return;
  const minMap = { "专业数学类": 3, "计算基础与编程类": 8, "机器感知类": 3, "数据与机器智能类": 4, "物理与电子类": 2, "研究课程": 0, "信科学院选修": 2, "心理学院选修": 2, "新生讨论课": 1 };
  const min = minMap[groupName];
  let md = `### ${groupName}\n\n`;
  if (min != null && min > 0) md += `**至少选修 ${min} 学分**\n\n`;
  else if (min === 0) md += `**0~6 学分**(论文内容不能与毕业论文重复使用)\n\n`;
  md += `| 课程名称 | 学分 | 学期 | 详细信息 |\n| -------- | ---- | ---- | -------- |\n`;
  courses.forEach(c => {
    md += `| ${c.name}${c.isAlt ? '(替代课)' : ''} | ${c.credit} | ${semesterLabel(c) || '-'} | ${c.meta} |\n`;
  });
  document.getElementById("modalTitle").textContent = groupName + " · 课程介绍";
  document.getElementById("modalMeta").textContent = `${cat.name} · 共 ${courses.length} 门课`;
  document.getElementById("modalDesc").innerHTML = mdToHtml(md);
  document.getElementById("modalImages").innerHTML = "";
  document.getElementById("modalMask").classList.add("show");
}

function renderCourseCard(c) {
  const isSelected = selected.has(c.id);
  const isCompleted = completed.has(c.id);
  const matches = courseMatchesSemester(c);
  const altItemSelected = c.alt ? selected.has(c.alt) : false;
  // 已修或已选时,不可再选修
  const disabled = (!matches && !isSelected) || altItemSelected || isCompleted;
  let titleAttr = "";
  if (disabled) {
    if (isCompleted) {
      titleAttr = ` title="已修课程,不可重复选修(可点击已修按钮取消标记)"`;
    } else if (altItemSelected) {
      const altItem = findCourse(c.alt);
      titleAttr = ` title="互斥课程「${altItem ? altItem.course.name : c.alt}」已选,不可选修"`;
    } else {
      titleAttr = ` title="非本学期(${semesterLabel(c) || '未指定'})不可选"`;
    }
  }
  const disabledCls = disabled ? " disabled" : "";
  const btnDisabled = disabled ? " disabled" : "";
  const creditBadge = c.credit > 0
    ? `<span class="course-credit">${c.credit} 学分</span>`
    : '<span class="course-credit" style="background:#eee;color:#95a5a6;">0 学分</span>';
  const altBadge = c.alt
    ? `<span style="display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;background:#fff3cd;color:#856404;font-size:11px;border:1px solid #ffe69c;">互斥</span>`
    : '';
  const altItem = c.alt ? findCourse(c.alt) : null;
  const altMeta = altItem
    ? `<div style="margin-top:2px;font-size:11px;color:#856404;">互斥:已选「${altItem.course.name}」时不可选修本课</div>`
    : '';
  return `
    <div class="course ${isSelected ? 'selected' : ''}${isCompleted ? ' completed' : ''}${disabledCls}" id="course-${c.id}"${titleAttr}>
      <div class="course-info">
        <div class="course-name">${c.name}${c.semester ? `<span class="course-semester">${semesterLabel(c)}</span>` : ''}${altBadge}</div>
        <div class="course-meta">${c.meta}</div>
        ${altMeta}
      </div>
      <div class="course-actions">
        ${creditBadge}
        ${c.desc ? `<button class="btn btn-detail" onclick="showDetail('${c.id}')" data-label="详情">详情</button>` : ''}
        <button class="btn btn-done${isCompleted ? ' active' : ''}" onclick="toggleCompleted('${c.id}')" title="标记为已修/未修" data-label-done="已修" data-label-active="已修✓">
          ${isCompleted ? '已修✓' : '已修'}
        </button>
        <button class="btn ${isSelected ? 'btn-drop' : 'btn-select'}" onclick="toggleCourse('${c.id}')"${btnDisabled} data-label-select="选修" data-label-drop="退选">
          ${isSelected ? '退选' : '选修'}
        </button>
      </div>
    </div>
  `;
}

function toggleGroup(key) {
  const body = document.getElementById("group-" + key);
  const arrow = document.getElementById("arrow-" + key);
  if (!body) return;
  if (body.style.display === "none") {
    body.style.display = "block";
    arrow.textContent = "▼";
  } else {
    body.style.display = "none";
    arrow.textContent = "▶";
  }
}

function toggleCourse(id) {
  const item = findCourse(id);
  if (!item) return;
  const wasSelected = selected.has(id);
  if (wasSelected) {
    selected.delete(id);
    showToast("已退选");
  } else {
    if (completed.has(id)) {
      showToast("已修课程,不可重复选修(请先取消已修标记)");
      return;
    }
    if (!courseMatchesSemester(item.course)) {
      showToast("非本学期课程,不可选修");
      return;
    }
    if (item.course.alt && selected.has(item.course.alt)) {
      const altItem = findCourse(item.course.alt);
      showToast(`已选互斥课程「${altItem ? altItem.course.name : item.course.alt}」,不可同时选修`);
      return;
    }
    selected.add(id);
    showToast("已选入");
  }
  saveSelected();
  if (currentView === "home") {
    renderTree();
  } else {
    // 局部更新受影响的卡片,避免重新渲染整个分类页导致分组折叠
    updateCourseCard(id);
    if (item.course.alt) updateCourseCard(item.course.alt);
    // 更新分组标题中的学分状态
    updateGroupHeaders();
  }
  renderSidebar();
}

function toggleCompleted(id) {
  const item = findCourse(id);
  if (!item) return;
  if (completed.has(id)) {
    completed.delete(id);
    showToast("已取消已修标记");
  } else {
    completed.add(id);
    showToast("已标记为已修");
  }
  saveCompleted();
  if (currentView === "home") {
    renderTree();
  } else {
    updateCourseCard(id);
  }
  renderSidebar();
}

function updateCourseCard(id) {
  const item = findCourse(id);
  if (!item) return;
  const el = document.getElementById("course-" + id);
  if (!el) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = renderCourseCard(item.course).trim();
  const newCard = tmp.firstChild;
  el.replaceWith(newCard);
}

function updateGroupHeaders() {
  // 更新当前分类页所有分组的学分状态与可选数
  const cat = categories.find(c => c.id === currentView);
  if (!cat || !cat.courses.some(c => c.group)) return;
  const groupMin = { "专业数学类": 3, "计算基础与编程类": 8, "机器感知类": 3, "数据与机器智能类": 4, "物理与电子类": 2, "研究课程": 0, "信科学院选修": 2, "心理学院选修": 2, "新生讨论课": 1 };
  const groupOrder = [];
  const groupMap = {};
  cat.courses.forEach(c => {
    const g = c.group || "其他";
    if (!groupMap[g]) { groupMap[g] = []; groupOrder.push(g); }
    groupMap[g].push(c);
  });
  groupOrder.forEach((g, idx) => {
    const courses = groupMap[g];
    const min = groupMin[g] != null ? groupMin[g] : null;
    let groupCredit = 0;
    let selCount = 0;
    courses.forEach(c => { if (selected.has(c.id)) { groupCredit += c.credit; selCount++; } });
    const availCount = courses.filter(c => courseMatchesSemester(c)).length;
    const statusEl = document.querySelector(`#group-${g}-${idx}`).closest('.course-group').querySelector('.group-status');
    const metaEl = document.querySelector(`#group-${g}-${idx}`).closest('.course-group').querySelector('.group-meta');
    if (statusEl) {
      statusEl.innerHTML = min != null
        ? (groupCredit >= min
            ? `<span style="color:#27ae60;">✓已选 ${groupCredit} 学分(达标)</span>`
            : `<span style="color:#e67e22;">差 ${min - groupCredit} 学分(已选 ${groupCredit})</span>`)
        : `<span style="color:#7f8c8d;">已选 ${groupCredit} 学分</span>`;
    }
    if (metaEl) {
      const minLabel = min != null ? ` · 至少 ${min} 学分` : "";
      metaEl.textContent = `${minLabel} · 已选 ${selCount} · 可选 ${availCount}`.trim();
    }
  });
}

function findCourse(id) {
  for (const cat of categories) {
    const c = cat.courses.find(c => c.id === id);
    if (c) return { cat, course: c };
  }
  return null;
}

function renderSidebar() {
  let totalCredit = 0;
  const catCredits = {};

  categories.forEach(cat => {
    catCredits[cat.id] = 0;
    cat.courses.forEach(c => {
      if (selected.has(c.id)) {
        totalCredit += c.credit;
        catCredits[cat.id] += c.credit;
      }
    });
  });

  document.getElementById("totalCredit").textContent = totalCredit;
  const progress = Math.min(100, (totalCredit / 141) * 100);
  document.getElementById("totalProgress").style.width = progress + "%";

  const reqList = document.getElementById("reqList");
  reqList.innerHTML = categories.map(cat => {
    const credit = catCredits[cat.id];
    let status, cls;
    if (credit >= cat.min && credit <= cat.max) {
      status = "✓"; cls = "ok";
    } else if (credit < cat.min) {
      status = `差${cat.min - credit}`; cls = "warn";
    } else {
      status = `超${credit - cat.max}`; cls = "warn";
    }
    return `<div class="req-item">
      <span>${cat.name}</span>
      <span class="${cls}">${credit}/${cat.require} ${status}</span>
    </div>`;
  }).join("");

  const list = document.getElementById("selectedList");
  const selCount = document.getElementById("selectedCount");
  if (selected.size === 0) {
    list.innerHTML = '<li class="empty">暂未选课</li>';
    selCount.textContent = "0 门 · 0 学分";
  } else {
    let selCredit = 0;
    list.innerHTML = Array.from(selected).map(id => {
      const item = findCourse(id);
      if (!item) return "";
      selCredit += item.course.credit;
      return `<li>
        <span>${item.course.name}</span>
        <span>
          ${item.course.credit}学分
          <button class="btn btn-drop" style="margin-left:6px;padding:2px 8px;" onclick="toggleCourse('${id}')">退</button>
        </span>
      </li>`;
    }).join("");
    selCount.textContent = `${selected.size} 门 · ${selCredit} 学分`;
  }

  // 已修课程列表
  let completedCredit = 0;
  const compList = document.getElementById("completedList");
  const compCount = document.getElementById("completedCount");
  if (completed.size === 0) {
    compList.innerHTML = '<li class="empty">暂无已修标记</li>';
    compCount.textContent = "0 门";
  } else {
    compList.innerHTML = Array.from(completed).map(id => {
      const item = findCourse(id);
      if (!item) return "";
      completedCredit += item.course.credit;
      return `<li>
        <span>${item.course.name}</span>
        <span>
          ${item.course.credit}学分
          <button class="btn btn-done" style="margin-left:6px;padding:2px 8px;" onclick="toggleCompleted('${id}')">取消</button>
        </span>
      </li>`;
    }).join("");
    compCount.textContent = `${completed.size} 门 · ${completedCredit} 学分`;
  }
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1500);
}

function showDetail(id) {
  const item = findCourse(id);

  document.getElementById("modalTitle").textContent = c.name;
  document.getElementById("modalMeta").textContent = `${item.cat.name} · ${c.credit} 学分 · ${c.meta}${c.semester ? ' · ' + semesterLabel(c) : ''}`;

  } else {
    imgsBox.innerHTML = "";
  }
  document.getElementById("modalMask").classList.add("show");
}

// 轻量 markdown → HTML 渲染(支持表格/标题/列表/加粗/段落/分隔线)
function mdToHtml(md) {
  if (!md) return "";
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let i = 0;
  let inList = false;
  const closeList = () => {
    if (inList === true) html += "</ul>";
    else if (inList === 'ol') html += "</ol>";
    inList = false;
  };

  while (i < lines.length) {
    const line = lines[i];

    // 表格:连续的 | ... | 行 + 分隔行
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[i + 1])) {
      closeList();
      const headerCells = line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(s => s.trim());
      let rows = [];
      let j = i + 2;
      while (j < lines.length && /^\s*\|/.test(lines[j])) {
        const cells = lines[j].trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(s => s.trim());
        rows.push(cells);
        j++;
      }
      html += '<div class="md-table-wrap"><table class="md-table"><thead><tr>';
      html += headerCells.map(c => `<th>${inline(c)}</th>`).join("");
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join("") + '</tr>';
      });
      html += '</tbody></table></div>';
      i = j;
      continue;
    }

    // 标题
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      closeList();
      const lvl = h[1].length;
      html += `<h${lvl}>${inline(h[2])}</h${lvl}>`;
      i++;
      continue;
    }

    // 分隔线
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
      closeList();
      html += '<hr>';
      i++;
      continue;
    }

    // 无序列表
    const li = line.match(/^\s*[-*+]\s+(.*)$/);
    if (li) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(li[1])}</li>`;
      i++;
      continue;
    }

    // 有序列表
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      if (!inList || inList !== 'ol') { closeList(); html += '<ol>'; inList = 'ol'; }
      html += `<li>${inline(ol[1])}</li>`;
      i++;
      continue;
    }

    // 空行
    if (/^\s*$/.test(line)) {
      closeList();
      i++;
      continue;
    }

    // 普通段落:连续多行合并,行间用 <br> 分隔
    closeList();
    let paraLines = [line];
    let j = i + 1;
    while (j < lines.length) {
      const nl = lines[j];
      if (/^\s*$/.test(nl)) break;
      if (/^\s*\|/.test(nl) && j + 1 < lines.length && /^\s*\|?[\s:-]+\|/.test(lines[j + 1])) break;
      if (/^(#{1,6})\s+/.test(nl)) break;
      if (/^\s*([-*_])\1{2,}\s*$/.test(nl)) break;
      if (/^\s*[-*+]\s+/.test(nl)) break;
      if (/^\s*\d+\.\s+/.test(nl)) break;
      paraLines.push(nl);
      j++;
    }
    html += `<p>${paraLines.map(inline).join("<br>")}</p>`;
    i = j;
  }
  closeList();
  return html;
}

function findTreeNode(id) {
  let result = null;
  (function search(arr) {
    for (const n of arr) {
      if (n.id === id) { result = n; return; }
      if (n.children) search(n.children);
      if (result) return;
    }
  })(tree);
  return result;
}

function showCatDetail(id) {
  const node = findTreeNode(id);
  if (!node || !node.desc) return;
  // 统计该节点下所有后代课程数
  let count = 0;
  (function countCourses(n) {
    if (n.courses) count += n.courses.length;
    if (n.children) n.children.forEach(countCourses);
  })(node);
  document.getElementById("modalTitle").textContent = node.name + " · 课程介绍";
  document.getElementById("modalMeta").textContent = `要求 ${node.require || '-'} · 共 ${count} 门课`;
  document.getElementById("modalDesc").innerHTML = mdToHtml(node.desc);
  const imgsBox = document.getElementById("modalImages");
  if (node.images && node.images.length) {
    imgsBox.innerHTML = `<div class="img-title">课程资料(共 ${node.images.length} 张)</div>` +
      node.images.map(src => `<img src="${src}" alt="课程资料" loading="lazy">`).join("");
  } else {
    imgsBox.innerHTML = "";
  }
  document.getElementById("modalMask").classList.add("show");
}

function closeDetail() {
  document.getElementById("modalMask").classList.remove("show");
}
